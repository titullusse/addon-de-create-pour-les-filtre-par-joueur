[[mods]]
modId="createplayerfilter"
version="1.0.0"
displayName="Create Player Filter"
authors="Imaginarium"
description='''
Un addon Create qui ajoute un filtre personnalisé pour trier/distribuer les items par joueur.

Fonctionnalités:
- Filtre par joueur (UUID stocké en data component)
- Coffre de tri accessible uniquement à son propriétaire
- Commandes /cpf tag <joueur> et /cpf untag
- Pensé pour fonctionner avec les machines Create (déployeurs, brass tunnels, smart chutes)
'''

[[dependencies.createplayerfilter]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.createplayerfilter]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"

[[dependencies.createplayerfilter]]
    modId="create"
    type="optional"
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"
